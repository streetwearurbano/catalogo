<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin | Streetwear Urbano</title>

    <link rel="stylesheet" href="admin.css">
</head>

<body>

    <main>

        <!-- =========================
             LOGIN
        ========================== -->

        <section id="login-admin">

            <h1>Panel de administración</h1>

            <form id="form-login">

                <input
                    type="email"
                    id="email"
                    placeholder="Correo electrónico"
                    autocomplete="email"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Contraseña"
                    autocomplete="current-password"
                    required
                >

                <button type="submit">
                    Ingresar
                </button>

            </form>

            <p id="mensaje-login"></p>

        </section>


        <!-- =========================
             PANEL
        ========================== -->

        <section id="panel-admin" style="display: none;">

            <h1>Administrar productos</h1>

            <button id="cerrar-sesion" type="button">
                Cerrar sesión
            </button>


            <!-- =========================
                 FORMULARIO PRODUCTO
            ========================== -->

            <h2 id="titulo-formulario">
                Agregar producto
            </h2>

            <form id="form-producto">

                <input
                    type="text"
                    id="nombre"
                    placeholder="Nombre del producto"
                    required
                >


                <input
                    type="number"
                    id="precio"
                    placeholder="Precio"
                    min="0"
                    step="0.01"
                    required
                >


                <select id="categoria" required>

                    <option value="">
                        Seleccionar categoría
                    </option>

                    <option value="conjuntos">
                        Conjuntos
                    </option>

                    <option value="remeras">
                        Remeras
                    </option>

                    <option value="shorts">
                        Shorts
                    </option>

                    <option value="camperas">
                        Camperas
                    </option>

                    <option value="jeans">
                        Jeans
                    </option>

                    <option value="accesorios">
                        Accesorios
                    </option>

                    <option value="calzado">
                        Calzado
                    </option>

                </select>


                <input
                    type="text"
                    id="talles"
                    placeholder="Talles: S, M, L, XL"
                    required
                >


                <div class="campo-imagen">

                    <label for="imagen">
                        Imagen del producto
                    </label>

                    <input
                        type="file"
                        id="imagen"
                        accept="image/*"
                    >

                    <small id="texto-imagen">
                        Seleccioná una imagen
                    </small>

                </div>


                <label class="campo-destacado">

                    <input
                        type="checkbox"
                        id="destacado"
                    >

                    Producto destacado

                </label>


                <button
                    type="submit"
                    id="boton-guardar"
                >
                    Agregar producto
                </button>


                <button
                    type="button"
                    id="cancelar-edicion"
                    style="display: none;"
                >
                    Cancelar edición
                </button>

            </form>


            <p id="mensaje-producto"></p>


            <!-- =========================
                 PRODUCTOS
            ========================== -->

            <h2>Productos</h2>

            <div id="lista-productos"></div>

        </section>

    </main>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="admin.js"></script>

</body>

</html>
