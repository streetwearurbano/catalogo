<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin | Streetwear Urbano</title>

    <link rel="stylesheet" href="admin.css">
</head>

<body>

    <main>

        <!-- =========================
             LOGIN
        ========================== -->

        <section id="login-admin">

            <h1>Panel de administración</h1>

            <form id="form-login">

                <input
                    type="email"
                    id="email"
                    placeholder="Correo electrónico"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Contraseña"
                    required
                >

                <button type="submit">
                    Ingresar
                </button>

            </form>

            <p id="mensaje-login"></p>

        </section>


        <!-- =========================
             PANEL ADMIN
        ========================== -->

        <section id="panel-admin" style="display: none;">

            <h1>Administrar productos</h1>

            <button id="cerrar-sesion">
                Cerrar sesión
            </button>


            <!-- =========================
                 FORMULARIO
            ========================== -->

            <h2 id="titulo-formulario">
                Agregar producto
            </h2>

            <form id="form-producto">

                <!-- NOMBRE -->

                <input
                    type="text"
                    id="nombre"
                    placeholder="Nombre del producto"
                    required
                >


                <!-- PRECIO -->

                <input
                    type="number"
                    id="precio"
                    placeholder="Precio"
                    min="0"
                    step="0.01"
                    required
                >


                <!-- CATEGORÍA -->

                <select id="categoria" required>

                    <option value="">
                        Seleccionar categoría
                    </option>

                    <option value="remeras">
                        Remeras
                    </option>

                    <option value="bermudas">
                        Bermudas / Shorts
                    </option>

                    <option value="pantalones">
                        Pantalones / Jeans
                    </option>

                    <option value="buzos">
                        Buzos / Camperas
                    </option>

                    <option value="calzado">
                        Calzado
                    </option>

                    <option value="accesorios">
                        Accesorios
                    </option>

                    <option value="conjuntos">
                        Conjuntos
                    </option>

                </select>


                <!-- TALLES -->

                <input
                    type="text"
                    id="talles"
                    placeholder="Talles disponibles. Ej: S, M, L, XL"
                    required
                >


                <!-- IMAGEN -->

                <div class="campo-imagen">

                    <input
                        type="file"
                        id="imagen"
                        accept="image/*"
                    >

                    <span id="texto-imagen">
                        Seleccioná una imagen
                    </span>

                </div>


                <!-- DESTACADO -->

                <label class="campo-destacado">

                    <input
                        type="checkbox"
                        id="destacado"
                    >

                    Producto destacado

                </label>


                <!-- GUARDAR -->

                <button
                    type="submit"
                    id="boton-guardar"
                >
                    Agregar producto
                </button>


                <!-- CANCELAR EDICIÓN -->

                <button
                    type="button"
                    id="cancelar-edicion"
                    style="display: none;"
                >
                    Cancelar edición
                </button>

            </form>


            <p id="mensaje-producto"></p>


            <!-- =========================
                 PRODUCTOS
            ========================== -->

            <h2>Productos</h2>

            <div id="lista-productos"></div>

        </section>

    </main>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- ADMIN -->

    <script src="admin.js"></script>

</body>

</html>
